<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="20" y="20" width="160" height="160" rx="40" ry="40" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- 书本/漫画图标 -->
  <g transform="translate(100, 100)">
    <!-- 左页 -->
    <path d="M -40,-35 Q -20,-45 0,-35 L 0,40 Q -20,30 -40,40 Z" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- 右页 -->
    <path d="M 0,-35 Q 20,-45 40,-35 L 40,40 Q 20,30 0,40 Z" fill="rgba(255,255,255,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- 书脊 -->
    <rect x="-2" y="-35" width="4" height="75" rx="2" fill="rgba(255,255,255,0.6)"/>
    
    <!-- 漫画格子线条 -->
    <line x1="-32" y1="-20" x2="-12" y2="-20" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-32" y1="-5" x2="-8" y2="-5" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-32" y1="10" x2="-15" y2="10" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    
    <line x1="8" y1="-20" x2="32" y2="-20" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="-5" x2="28" y2="-5" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="8" y1="10" x2="25" y2="10" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    
    <!-- 无限/自动符号 -->
    <path d="M -15,28 Q -25,22 -15,16 Q -5,22 -15,28" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 15,28 Q 25,22 15,16 Q 5,22 15,28" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>
  
  <!-- 装饰小点 -->
  <circle cx="155" cy="55" r="4" fill="url(#accent)" opacity="0.8"/>
  <circle cx="165" cy="70" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="45" cy="145" r="3" fill="url(#accent)" opacity="0.6"/>
</svg>
